name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  correctness:
    name: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test with overflow checks
        run: cargo test --locked
      - name: Test optimized code
        run: cargo test --release --locked
      - name: Build server
        run: cargo build --release --locked
      - name: Install independent protocol clients
        run: python -m pip install -r benchmarks/interop-requirements.txt
      - name: Protocol interoperability
        run: python benchmarks/interoperability.py target/release/hfast
      - name: UDP receive capacity, host caps and socket-option failures
        run: python benchmarks/udp-buffer-check.py target/release/hfast
      - name: HTTP/1 body fragments and pipelining
        run: python benchmarks/h1-body-check.py target/release/hfast
      - name: HTTP/1 header fragments and delayed errors
        run: python benchmarks/h1-header-check.py target/release/hfast
      - name: HTTP/1 response pipelines and backpressure
        run: python benchmarks/h1-response-check.py target/release/hfast
      - name: TCP batch boundaries and connection replacement
        run: |
          python benchmarks/tcp-churn-check.py target/release/hfast
          python benchmarks/tcp-churn-check.py target/release/hfast --threads 2
      - name: TCP progress with input already queued
        run: |
          python benchmarks/tcp-buffered-read-check.py target/release/hfast
          python benchmarks/tcp-buffered-read-check.py target/release/hfast --threads 2
      - name: TCP half-close with queued responses
        run: |
          python benchmarks/tcp-halfclose-check.py target/release/hfast
          python benchmarks/tcp-halfclose-check.py target/release/hfast --threads 2
      - name: Mixed TCP protocols through receive classification
        run: |
          python benchmarks/tcp-mixed-receive-check.py target/release/hfast
          python benchmarks/tcp-mixed-receive-check.py target/release/hfast --threads 2
      - name: HTTP/2 request header continuations
        run: python benchmarks/h2-continuation-check.py target/release/hfast
      - name: HTTP/2 field blocks, pipelined native accounting and failure oracles
        run: |
          python -m unittest discover -s benchmarks -p test_h2_field_report.py -v
          rustfmt --edition 2024 --check benchmarks/h2-field-peer.rs
          rustc --edition=2024 -D warnings --test benchmarks/h2-field-peer.rs -o /tmp/h2-field-tests
          /tmp/h2-field-tests
          rustc --edition=2024 -D warnings --test -O benchmarks/h2-field-peer.rs -o /tmp/h2-field-tests-release
          /tmp/h2-field-tests-release
          rustc --edition=2024 -D warnings -O -C lto=fat -C codegen-units=1 benchmarks/h2-field-peer.rs -o /tmp/h2-field-peer
          python benchmarks/h2-field-check.py target/release/hfast --peer /tmp/h2-field-peer
      - name: HTTP/2 response credit, HPACK capacity and backpressure
        run: python benchmarks/h2-flow-control-check.py target/release/hfast
      - name: HTTP/2 upload fragments, delayed errors and partial-body EOF
        run: |
          python benchmarks/h2-data-check.py target/release/hfast
          python benchmarks/h2-data-check.py target/release/hfast --threads 2
      - name: HTTP/2 batched request credit and sustained uploads
        run: |
          python benchmarks/h2-upload-credit-check.py target/release/hfast
          python benchmarks/h2-upload-credit-check.py target/release/hfast --threads 2
      - name: Native HTTP/2 upload accounting and fault oracles
        run: |
          rustfmt --edition 2024 --check benchmarks/h2-upload-peer.rs
          rustc --edition=2024 --test benchmarks/h2-upload-peer.rs -o /tmp/h2-upload-tests
          /tmp/h2-upload-tests
          rustc --edition=2024 --test -O benchmarks/h2-upload-peer.rs -o /tmp/h2-upload-tests-release
          /tmp/h2-upload-tests-release
          rustc --edition=2024 -O -C lto=fat -C codegen-units=1 benchmarks/h2-upload-peer.rs -o /tmp/h2-upload-peer
          python benchmarks/h2-upload-oracle-check.py /tmp/h2-upload-peer --server target/release/hfast
      - name: QUIC handshake recovery with sparse ACKs
        run: python benchmarks/crypto-recovery-check.py target/release/hfast
      - name: Coalesced QUIC receive offsets, sample bounds and failure oracles
        run: |
          python -m unittest discover -s benchmarks -p test_coalesced_receive.py -v
          python benchmarks/coalesced-receive-check.py target/release/hfast --output "$RUNNER_TEMP/coalesced"
          python benchmarks/coalesced-receive-check.py target/release/hfast --threads 2 --output "$RUNNER_TEMP/coalesced-t2"
          HFAST_GRO_BINARY="$PWD/target/release/hfast" python benchmarks/coalesced-receive-check.py benchmarks/without-udp-gro.py --threads 2 --output "$RUNNER_TEMP/coalesced-denied-t2"
          python benchmarks/coalesced-receive-check.py target/release/hfast --scenario finished-retired --cid-length 0
          python benchmarks/coalesced-receive-check.py target/release/hfast --scenario finished-retired --cid-length 20
      - name: Preserve coalesced receive failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coalesced-receive-failure
          path: ${{ runner.temp }}/coalesced*
          retention-days: 7
      - name: QUIC sparse receive ACK boundaries and independent failure oracles
        run: |
          python -m unittest discover -s benchmarks -p test_receive_ack.py -v
          python benchmarks/receive-ack-check.py target/release/hfast --output "$RUNNER_TEMP/receive-ack"
          python benchmarks/receive-ack-check.py target/release/hfast --threads 2 --output "$RUNNER_TEMP/receive-ack-t2"
          HFAST_GRO_BINARY="$PWD/target/release/hfast" python benchmarks/receive-ack-check.py benchmarks/without-udp-gro.py --threads 2 --output "$RUNNER_TEMP/receive-ack-denied-t2"
      - name: Preserve sparse receive ACK evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: receive-ack-evidence
          path: ${{ runner.temp }}/receive-ack*
          retention-days: 7
      - name: QUIC recovery oracle, deterministic impairments and failure controls
        run: |
          python -m unittest discover -s benchmarks -p test_quic_recovery.py -v
          python benchmarks/quic-loss-check.py target/release/hfast --output "$RUNNER_TEMP/quic-recovery"
          python benchmarks/quic-loss-check.py target/release/hfast --threads 2 --output "$RUNNER_TEMP/quic-recovery-t2"
          HFAST_GRO_BINARY="$PWD/target/release/hfast" python benchmarks/quic-loss-check.py benchmarks/without-udp-gro.py --threads 2 --output "$RUNNER_TEMP/quic-recovery-denied-t2"
      - name: QUIC full handshakes without unused session tickets
        run: python benchmarks/tls-ticket-check.py target/release/hfast
      - name: QUIC control recovery with repeated packet loss
        run: python benchmarks/control-recovery-check.py target/release/hfast
      - name: QUIC request recovery with reordering and loss
        run: python benchmarks/stream-recovery-check.py target/release/hfast
      - name: QUIC credit recovery with repeated packet loss
        run: python benchmarks/credit-recovery-check.py target/release/hfast
      - name: QUIC stream receive credit for large request bodies
        run: python benchmarks/stream-credit-check.py target/release/hfast
      - name: QUIC sparse stream receive credit with delayed FIN
        run: python benchmarks/sparse-stream-credit-check.py target/release/hfast
      - name: QUIC response credit, partial sends and recovery
        run: python benchmarks/response-credit-check.py target/release/hfast
      - name: QUIC late ACKs of complete responses
        run: python benchmarks/response-recovery-check.py target/release/hfast
      - name: QUIC stream table retirement with an unfinished higher request
        run: python benchmarks/stream-table-bench.py target/release/hfast --slots 4096 --requests 2048 --warmup 128
      - name: QUIC ascending ACKs with a full response window
        run: python benchmarks/ack-ledger-bench.py target/release/hfast --window 1024 --requests 256 --warmup 64
      - name: QUIC sparse ACK ranges with a full response window
        run: python benchmarks/sparse-ack-bench.py target/release/hfast --window 1024 --ranges 64 --cycles 1
      - name: Fixed native QUIC workload transport
        uses: actions/checkout@v5
        with:
          repository: hatoo/shb
          ref: 48b2d7e2ca138ea9f69190cd3ae4112058fb56d7
          path: .native-peer-shb
          persist-credentials: false
      - name: Native sparse ACK oracle and response fences
        run: |
          python benchmarks/build-sparse-ack-peer.py .native-peer-shb "$RUNNER_TEMP/sparse-ack-peer"
          python benchmarks/compare-sparse-acks.py target/release/hfast target/release/hfast "$RUNNER_TEMP/sparse-ack-peer/sparse-ack-peer" "$RUNNER_TEMP/sparse-ack-smoke" --window 1024 --ranges 64 --batch 8 --cycles 1 --pairs 1 --client-cpu 1
      - name: Fixed native complete-upload transport
        uses: actions/checkout@v5
        with:
          repository: hatoo/shb
          ref: eabad04e72a0d684da06e096077cc47aca595bbc
          path: .stream-credit-shb
          persist-credentials: false
      - name: Native QUIC uploads, bounded ACKs and failure oracles
        env:
          NATIVE_PEER_TARGET_DIR: ${{ runner.temp }}/sparse-ack-peer/target
        run: |
          rustfmt --edition 2024 --config skip_children=true --check benchmarks/stream-credit-peer-main.rs benchmarks/stream-credit-control.rs benchmarks/stream-credit-ledger.rs benchmarks/udp-socket-evidence.rs
          python benchmarks/build-stream-credit-peer.py .stream-credit-shb "$RUNNER_TEMP/stream-credit-peer"
          sudo unshare --net sh -c 'ip link set lo up && exec "$@"' credit-peer \
            "$(command -v python)" benchmarks/stream-credit-peer-check.py \
            "$RUNNER_TEMP/stream-credit-peer/stream-credit-peer" "$RUNNER_TEMP/stream-credit-check" --server target/release/hfast
          sudo unshare --net sh -c 'ip link set lo up && exec "$@"' credit-peer-t2 \
            "$(command -v python)" benchmarks/stream-credit-peer-check.py \
            "$RUNNER_TEMP/stream-credit-peer/stream-credit-peer" "$RUNNER_TEMP/stream-credit-t2" --server target/release/hfast --only-server --threads 2 --streams 8 --mode sparse,pto
          STREAM_CREDIT_VALID_ROW="$RUNNER_TEMP/stream-credit-check/ordinary.stdout" python -m unittest discover -s benchmarks -p test_udp_accounting.py -v
      - name: Concurrent upload clocks, aggregate accounting and failed producers
        run: |
          python -m unittest discover -s benchmarks -p test_concurrent_uploads.py -v
          sudo unshare --net sh -c 'ip link set lo up && exec "$@"' upload-faults \
            "$(command -v python)" benchmarks/concurrent-upload-fault-check.py \
            "$PWD/target/release/hfast" "$RUNNER_TEMP/stream-credit-peer/stream-credit-peer" \
            "$RUNNER_TEMP/concurrent-upload-faults"
      - name: Preserve native upload failure ledgers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stream-credit-failure
          path: |
            ${{ runner.temp }}/stream-credit-check
            ${{ runner.temp }}/stream-credit-t2
            ${{ runner.temp }}/concurrent-upload-faults
          retention-days: 7
      - name: Native cancellation accounting and failure oracles
        env:
          NATIVE_PEER_TARGET_DIR: ${{ runner.temp }}/sparse-ack-peer/target
        run: |
          python benchmarks/build-stop-batch-peer.py .native-peer-shb "$RUNNER_TEMP/stop-peer"
          python -m unittest discover -s benchmarks -p test_stop_batch.py -v
      - name: Native sparse cancellations, reset ACKs and independent wire checks
        run: |
          sudo unshare --net sh -c 'ip link set lo up && exec "$@"' stop-smoke \
            "$(command -v python)" benchmarks/stop-batch-check.py \
            "$PWD/target/release/hfast" "$RUNNER_TEMP/stop-peer/stop-batch-peer" \
            "$RUNNER_TEMP/stop-smoke" --client-cpu 1
          sudo unshare --net sh -c 'ip link set lo up && exec "$@"' stop-wire \
            "$(command -v python)" benchmarks/stop-batch-wire-check.py \
            "$PWD/target/release/hfast" "$RUNNER_TEMP/stop-peer/stop-batch-peer" \
            "$RUNNER_TEMP/stop-wire" --client-cpu 1
          sudo unshare --net sh -c 'ip link set lo up && exec "$@"' stop-faults \
            "$(command -v python)" benchmarks/stop-batch-fault-check.py \
            "$PWD/target/release/hfast" "$RUNNER_TEMP/stop-peer/stop-batch-peer" \
            "$RUNNER_TEMP/stop-faults" --client-cpu 1
      - name: QUIC uni credit with gaps and retransmission
        run: python benchmarks/uni-accounting-check.py target/release/hfast
      - name: QUIC cancellation credit and reset recovery
        run: python benchmarks/reset-accounting-check.py target/release/hfast
      - name: QUIC peer key updates, reordering and forgery
        run: python benchmarks/key-update-check.py target/release/hfast
      - name: QUIC recovery with UDP_GRO unavailable
        run: python benchmarks/gro-interop.py target/release/hfast "$RUNNER_TEMP/gro-denied" --without-gro
      - name: QUIC recovery over actual UDP_SEGMENT groups
        run: |
          python benchmarks/gro-interop.py target/release/hfast "$RUNNER_TEMP/gso-native" --gso
          python benchmarks/gro-interop.py target/release/hfast "$RUNNER_TEMP/gso-denied" --gso --without-gro
      - name: Native GSO response oracle
        env:
          NATIVE_PEER_TARGET_DIR: ${{ runner.temp }}/sparse-ack-peer/target
        run: python benchmarks/build-sparse-ack-peer.py .native-peer-shb "$RUNNER_TEMP/gso-peer" --burst
      - name: Concurrent native producer accounting and failure oracles
        run: |
          rustfmt --edition 2024 --config skip_children=true --check benchmarks/burst-peer-main.rs benchmarks/burst-worker.rs benchmarks/burst-latency.rs
          python -m unittest discover -s benchmarks -p test_burst_workers.py -v
          python -m unittest discover -s benchmarks -p test_burst_buffer.py -v
          python -m unittest discover -s benchmarks -p test_burst_latency.py -v
          python -m unittest discover -s benchmarks -p test_burst_schedule.py -v
          python -m unittest discover -s benchmarks -p test_burst_sockets.py -v
      - name: Concurrent native producers with GRO and fallback delivery
        run: |
          sudo unshare --net sh -c 'ip link set lo up && exec "$@"' native-producers \
            "$(command -v python)" benchmarks/burst-worker-check.py \
            "$PWD/target/release/hfast" "$RUNNER_TEMP/gso-peer/burst-peer" \
            "$RUNNER_TEMP/concurrent-producer-smoke"
          sudo unshare --net sh -c 'ip link set lo up && exec "$@"' native-producers-buffer \
            "$(command -v python)" benchmarks/burst-worker-check.py \
            "$PWD/target/release/hfast" "$RUNNER_TEMP/gso-peer/burst-peer" \
            "$RUNNER_TEMP/concurrent-producer-buffer-smoke" --udp-receive-buffer 4194304
      - name: Native burst failure snapshots, socket overflow and bounded cleanup
        run: |
          sudo unshare --net sh -c 'ip link set lo up && exec "$@"' burst-faults \
            "$(command -v python)" benchmarks/burst-worker-fault-check.py \
            "$PWD/target/release/hfast" "$RUNNER_TEMP/gso-peer/burst-peer" \
            "$RUNNER_TEMP/burst-faults"
      - name: Exact native burst latency, bounded exports and failure oracles
        run: |
          sudo unshare --net sh -c 'ip link set lo up && exec "$@"' burst-latency \
            "$(command -v python)" benchmarks/burst-latency-check.py \
            "$PWD/target/release/hfast" "$RUNNER_TEMP/gso-peer/burst-peer" \
            "$RUNNER_TEMP/burst-latency"
      - name: Fixed asymmetric native schedules and complete-phase overlap
        run: |
          sudo unshare --net sh -c 'ip link set lo up && exec "$@"' burst-schedule \
            "$(command -v python)" benchmarks/burst-schedule-check.py \
            "$PWD/target/release/hfast" "$RUNNER_TEMP/gso-peer/burst-peer" \
            "$RUNNER_TEMP/burst-schedule"
      - name: Preserve native burst failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: burst-failure-evidence
          path: |
            ${{ runner.temp }}/burst-faults
            ${{ runner.temp }}/concurrent-producer-smoke
            ${{ runner.temp }}/concurrent-producer-buffer-smoke
            ${{ runner.temp }}/burst-latency
            ${{ runner.temp }}/burst-schedule
          retention-days: 7
      - name: Native reference workers with exact owned sockets and failed processes
        run: |
          sudo unshare --net sh -c 'ip link set lo up && exec "$@"' burst-reference \
            "$(command -v python)" benchmarks/burst-reference-check.py \
            "$PWD/target/release/hfast" "$RUNNER_TEMP/gso-peer/burst-peer" \
            "$RUNNER_TEMP/burst-reference"
      - name: Preserve reference socket evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: burst-reference-evidence
          path: ${{ runner.temp }}/burst-reference
          retention-days: 7
      - name: Fixed CRYPTO churn transport
        uses: actions/checkout@v5
        with:
          repository: hatoo/shb
          ref: 12e95af17ef6015020776ab65996bef9531099e0
          path: .crypto-churn-shb
          persist-credentials: false
      - name: Native CRYPTO schedule and TLS/HTTP failure oracles
        env:
          NATIVE_PEER_TARGET_DIR: ${{ runner.temp }}/sparse-ack-peer/target
        run: |
          python benchmarks/build-crypto-churn-peer.py .crypto-churn-shb "$RUNNER_TEMP/crypto-churn-peer"
          python -m unittest discover -s benchmarks -p test_crypto_churn.py -v
          python benchmarks/crypto-churn-interop.py "$RUNNER_TEMP/crypto-churn-peer/crypto-churn-peer" "$RUNNER_TEMP/crypto-churn-interop"
      - name: Native CRYPTO churn with GRO and fallback delivery
        run: |
          sudo unshare --net sh -c 'ip link set lo up && exec "$@"' crypto-churn \
            "$(command -v python)" benchmarks/crypto-churn-check.py \
            "$PWD/target/release/hfast" "$RUNNER_TEMP/crypto-churn-peer/crypto-churn-peer" \
            "$RUNNER_TEMP/crypto-churn-smoke"
      - name: Persistent native peer accounting and independent failure oracles
        env:
          NATIVE_PEER_TARGET_DIR: ${{ runner.temp }}/sparse-ack-peer/target
        run: |
          rustfmt --edition 2024 --config skip_children=true --check benchmarks/persistent-peer-main.rs
          python benchmarks/build-crypto-churn-peer.py .crypto-churn-shb "$RUNNER_TEMP/persistent-peer" --persistent
          python -m unittest discover -s benchmarks -p test_persistent_peers.py -v
          python benchmarks/persistent-peer-interop.py "$RUNNER_TEMP/persistent-peer/persistent-peer" "$RUNNER_TEMP/persistent-interop"
      - name: Persistent native peers with GRO and fallback delivery
        run: |
          sudo unshare --net sh -c 'ip link set lo up && exec "$@"' persistent-peers \
            "$(command -v python)" benchmarks/persistent-peer-check.py \
            "$PWD/target/release/hfast" "$RUNNER_TEMP/persistent-peer/persistent-peer" \
            "$RUNNER_TEMP/persistent-smoke"
      - name: Fixed native response-credit transport
        uses: actions/checkout@v5
        with:
          repository: hatoo/shb
          ref: 3a13d87922f9fd92e19ea2de8c3375dcd7a48e11
          path: .response-credit-shb
          persist-credentials: false
      - name: Native response-credit ledgers and independent wire faults
        env:
          NATIVE_PEER_TARGET_DIR: ${{ runner.temp }}/sparse-ack-peer/target
        run: |
          rustfmt --edition 2024 --config skip_children=true --check benchmarks/response-credit-peer-main.rs benchmarks/response-credit-ledger.rs
          python -m unittest discover -s benchmarks -p test_response_credit_reports.py -v
          python benchmarks/build-response-credit-peer.py .response-credit-shb "$RUNNER_TEMP/response-credit-peer"
          python benchmarks/response-credit-peer-interop.py "$RUNNER_TEMP/response-credit-peer/response-credit-peer" "$RUNNER_TEMP/response-credit-interop"
      - name: Native small response-credit, sparse ACKs and reliable grants
        run: |
          sudo unshare --net sh -c 'ip link set lo up && exec "$@"' response-credit \
            "$(command -v python)" benchmarks/response-credit-native-check.py \
            "$PWD/target/release/hfast" "$RUNNER_TEMP/response-credit-peer/response-credit-peer" \
            "$RUNNER_TEMP/response-credit-native" --cpu 1
      - name: Preserve native response-credit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: response-credit-evidence
          path: |
            ${{ runner.temp }}/response-credit-native
            ${{ runner.temp }}/response-credit-interop
            ${{ runner.temp }}/response-credit-peer/manifest.json
          retention-days: 7
      - name: Sustained response-credit generations and independent wire faults
        env:
          NATIVE_PEER_TARGET_DIR: ${{ runner.temp }}/sparse-ack-peer/target
        run: |
          rustfmt --edition 2024 --config skip_children=true --check benchmarks/response-credit-sustained-main.rs benchmarks/response-credit-waves.rs
          python -m unittest discover -s benchmarks -p test_response_credit_sustained_reports.py -v
          python benchmarks/build-response-credit-sustained.py .response-credit-shb "$RUNNER_TEMP/response-credit-sustained"
          python benchmarks/response-credit-sustained-interop.py "$RUNNER_TEMP/response-credit-sustained/response-credit-sustained" "$RUNNER_TEMP/response-credit-sustained-interop"
      - name: Native bounded response-credit waves with exact socket evidence
        run: |
          for schedule in byte two-byte two-fragment full; do
            sudo unshare --net sh -c 'ip link set lo up && exec "$@"' credit-waves \
              "$(command -v python)" benchmarks/response-credit-sustained-check.py \
              "$PWD/target/release/hfast" "$RUNNER_TEMP/response-credit-sustained/response-credit-sustained" \
              "$RUNNER_TEMP/credit-waves-$schedule" --count 1024 --window 512 --schedule "$schedule" --cpu 1 --trace
          done
      - name: Preserve sustained response-credit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sustained-response-credit-evidence
          path: |
            ${{ runner.temp }}/credit-waves-*
            ${{ runner.temp }}/response-credit-sustained-interop
            ${{ runner.temp }}/response-credit-sustained/manifest.json
          retention-days: 7
