name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  correctness:
    name: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test with overflow checks
        run: cargo test --locked
      - name: Test optimized code
        run: cargo test --release --locked
      - name: Build server
        run: cargo build --release --locked
      - name: Install independent protocol clients
        run: python -m pip install -r benchmarks/interop-requirements.txt
      - name: Protocol interoperability
        run: python benchmarks/interoperability.py target/release/hfast
      - name: Protocol interoperability with epoll
        run: python benchmarks/interoperability.py target/release/hfast --epoll
      - name: QUIC handshake recovery with sparse ACKs
        run: python benchmarks/crypto-recovery-check.py target/release/hfast
      - name: QUIC control recovery with repeated packet loss
        run: python benchmarks/control-recovery-check.py target/release/hfast
      - name: QUIC control recovery with epoll
        run: python benchmarks/control-recovery-check.py target/release/hfast --epoll
      - name: QUIC request recovery with reordering and loss
        run: python benchmarks/stream-recovery-check.py target/release/hfast
      - name: QUIC request recovery with epoll
        run: python benchmarks/stream-recovery-check.py target/release/hfast --epoll
      - name: QUIC delayed request across many stream windows
        run: python benchmarks/stream-retention-check.py target/release/hfast --requests 4096
      - name: QUIC delayed request across many stream windows with epoll
        run: python benchmarks/stream-retention-check.py target/release/hfast --requests 4096 --epoll
      - name: QUIC credit recovery with repeated packet loss
        run: python benchmarks/credit-recovery-check.py target/release/hfast
      - name: QUIC credit recovery with epoll
        run: python benchmarks/credit-recovery-check.py target/release/hfast --epoll
      - name: QUIC uni credit with gaps and retransmission
        run: python benchmarks/uni-accounting-check.py target/release/hfast
      - name: QUIC uni credit with epoll
        run: python benchmarks/uni-accounting-check.py target/release/hfast --epoll
      - name: QUIC cancellation credit and reset recovery
        run: python benchmarks/reset-accounting-check.py target/release/hfast
      - name: QUIC cancellation credit with epoll
        run: python benchmarks/reset-accounting-check.py target/release/hfast --epoll
