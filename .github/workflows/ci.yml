name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  correctness:
    name: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test with overflow checks
        run: cargo test --locked
      - name: Test optimized code
        run: cargo test --release --locked
      - name: Build server
        run: cargo build --release --locked
      - name: Install independent protocol clients
        run: python -m pip install -r benchmarks/interop-requirements.txt
      - name: Protocol interoperability
        run: python benchmarks/interoperability.py target/release/hfast
      - name: HTTP/1 body fragments and pipelining
        run: python benchmarks/h1-body-check.py target/release/hfast
      - name: HTTP/1 header fragments and delayed errors
        run: python benchmarks/h1-header-check.py target/release/hfast
      - name: HTTP/1 response pipelines and backpressure
        run: python benchmarks/h1-response-check.py target/release/hfast
      - name: TCP batch boundaries and connection replacement
        run: |
          python benchmarks/tcp-churn-check.py target/release/hfast
          python benchmarks/tcp-churn-check.py target/release/hfast --threads 2
      - name: TCP progress with input already queued
        run: |
          python benchmarks/tcp-buffered-read-check.py target/release/hfast
          python benchmarks/tcp-buffered-read-check.py target/release/hfast --threads 2
      - name: TCP half-close with queued responses
        run: |
          python benchmarks/tcp-halfclose-check.py target/release/hfast
          python benchmarks/tcp-halfclose-check.py target/release/hfast --threads 2
      - name: HTTP/2 request header continuations
        run: python benchmarks/h2-continuation-check.py target/release/hfast
      - name: HTTP/2 response credit and backpressure
        run: python benchmarks/h2-flow-control-check.py target/release/hfast
      - name: QUIC handshake recovery with sparse ACKs
        run: python benchmarks/crypto-recovery-check.py target/release/hfast
      - name: QUIC control recovery with repeated packet loss
        run: python benchmarks/control-recovery-check.py target/release/hfast
      - name: QUIC request recovery with reordering and loss
        run: python benchmarks/stream-recovery-check.py target/release/hfast
      - name: QUIC credit recovery with repeated packet loss
        run: python benchmarks/credit-recovery-check.py target/release/hfast
      - name: QUIC stream receive credit for large request bodies
        run: python benchmarks/stream-credit-check.py target/release/hfast
      - name: QUIC sparse stream receive credit with delayed FIN
        run: python benchmarks/sparse-stream-credit-check.py target/release/hfast
      - name: QUIC response credit, partial sends and recovery
        run: python benchmarks/response-credit-check.py target/release/hfast
      - name: QUIC late ACKs of complete responses
        run: python benchmarks/response-recovery-check.py target/release/hfast
      - name: QUIC uni credit with gaps and retransmission
        run: python benchmarks/uni-accounting-check.py target/release/hfast
      - name: QUIC cancellation credit and reset recovery
        run: python benchmarks/reset-accounting-check.py target/release/hfast
      - name: QUIC peer key updates, reordering and forgery
        run: python benchmarks/key-update-check.py target/release/hfast
