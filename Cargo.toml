[package]
name = "hfast"
version = "0.1.0"
edition = "2024"

[dependencies]
io-uring = "0.7.14"
libc = "0.2"
memchr = "2"
# TLS 1.3 and packet protection for the in-tree QUIC transport.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.13"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
